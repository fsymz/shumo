name: G02 fresh01 explicit release publisher
on:
  push:
    paths:
      - 'deliveries/stage03/G02_RADIAL_FEM/20260910T1731Z-fresh01/RELEASE_READY.json'
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify and publish only the explicitly prepared G02 delivery
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd deliveries/stage03/G02_RADIAL_FEM/20260910T1731Z-fresh01
          python publish_release.py --ready RELEASE_READY.json
