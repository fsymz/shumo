name: G01 direct receiver connectivity probe (NOT formal delivery)
on:
  push:
    paths:
      - '.github/workflows/stage03_g01_20260910T173132Z_direct_receiver_probe.yml'
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Receive only the predetermined harmless probe bytes
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          cat > /tmp/g01_receiver_probe.py <<'PY'
          import os,json,time,hashlib,base64,urllib.request
          from http.server import HTTPServer,BaseHTTPRequestHandler
          expected=b'G01 direct receiver probe 20260910\n'
          repo=os.environ['REPO'];path='deliveries/stage03/G01_RADIAL_FV/20260910T173132Z-114cfd3a/transport/direct_probe_endpoint.json'
          with urllib.request.urlopen('https://api.ipify.org',timeout=20) as r:ip=r.read().decode().strip()
          headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','Content-Type':'application/json'}
          def publish(data,sha=None):
              body={'message':'G01 transport-only connectivity observation','content':base64.b64encode((json.dumps(data,indent=2)+'\n').encode()).decode()}
              if sha:body['sha']=sha
              req=urllib.request.Request('https://api.github.com/repos/'+repo+'/contents/'+path,data=json.dumps(body).encode(),headers=headers,method='PUT')
              with urllib.request.urlopen(req,timeout=30) as r:return json.load(r)['content']['sha']
          state={'probe_only':True,'endpoint':'http://'+ip+':443/g01-probe','expected_bytes':len(expected),'expected_sha256':hashlib.sha256(expected).hexdigest(),'expires_unix':time.time()+180,'accepted':False,'formal_delivery_uploaded':False}
          class Handler(BaseHTTPRequestHandler):
              def do_POST(self):
                  size=int(self.headers.get('Content-Length','0'))
                  if self.path!='/g01-probe' or size!=len(expected):self.send_error(400);return
                  data=self.rfile.read(size)
                  if data!=expected:self.send_error(400);return
                  state['accepted']=True;reply=json.dumps({'accepted':True,'sha256':hashlib.sha256(data).hexdigest()}).encode()
                  self.send_response(200);self.send_header('Content-Type','application/json');self.send_header('Content-Length',str(len(reply)));self.end_headers();self.wfile.write(reply)
              def log_message(self,*args):pass
          server=HTTPServer(('0.0.0.0',443),Handler);server.timeout=2
          sha=publish(state);print(json.dumps(state),flush=True)
          while not state['accepted'] and time.time()<state['expires_unix']:server.handle_request()
          server.server_close();state['finished_unix']=time.time();publish(state,sha);print(json.dumps(state),flush=True)
          raise SystemExit(0 if state['accepted'] else 2)
          PY
          sudo -E python3 /tmp/g01_receiver_probe.py
